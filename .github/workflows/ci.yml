name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.22', '1.23', '1.26.9', '1.27.2']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Compile integration tests without API calls
        run: go test -tags=integration -run '^$' ./...

      - name: Upload coverage to Codecov
        if: matrix.go-version == '1.22'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.out
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Check coverage threshold
        if: matrix.go-version == '1.22'
        run: |
          # Example programs and test helpers are outside the SDK coverage budget.
          awk 'NR > 1 && $1 !~ /\/(examples|testutil)\// {
            total += $2
            if ($3 > 0) covered += $2
          } END {
            coverage = total ? 100 * covered / total : 0
            printf "SDK coverage: %.1f%%; required: 70%%\n", coverage
            if (total == 0 || coverage < 70) exit 1
          }' coverage.out

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.1
          args: --timeout=5m

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Build
        run: go build -v ./...

  security:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

  fuzz:
    name: Decoder fuzz smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
      - run: go test ./api/apiv1 -run '^$' -fuzz '^FuzzTxEvent$' -fuzztime=10s -parallel=2
      - run: go test ./api/apiv1 -run '^$' -fuzz '^FuzzWSEvent$' -fuzztime=10s -parallel=2
      - run: go test ./api/apiv1 -run '^$' -fuzz '^FuzzPortfolioResponse$' -fuzztime=10s -parallel=2
      - run: go test ./api -run '^$' -fuzz '^FuzzResponseEnvelope$' -fuzztime=10s -parallel=2
      - run: go test . -run '^$' -fuzz '^FuzzRetryAfter$' -fuzztime=10s -parallel=2
