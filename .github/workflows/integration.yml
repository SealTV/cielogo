name: Integration Tests

on:
  workflow_dispatch:
    inputs:
      credit_budget:
        description: 'Explicit credit ceiling for the read-only release smoke (72-100)'
        required: true
        type: number
        default: 72

jobs:
  integration:
    name: Budgeted API release smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache: true
      - name: Check API key
        env:
          CIELO_API_KEY: ${{ secrets.CIELO_API_KEY }}
        run: |
          if [ -z "$CIELO_API_KEY" ]; then
            echo "CIELO_API_KEY secret is missing"
            exit 1
          fi
      - name: Run read-only smoke with an explicit budget
        env:
          CIELO_API_KEY: ${{ secrets.CIELO_API_KEY }}
          CIELO_LIVE_CREDIT_BUDGET: ${{ inputs.credit_budget }}
        run: go test -v -tags=integration -run '^TestIntegrationReleaseSmoke$' -timeout=4m .
